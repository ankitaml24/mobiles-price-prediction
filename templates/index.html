<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mobile Price Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; display: inline-block; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mobile Price Prediction</h2>
        <form action="/predict" method="post">
            <input type="number" name="ram" placeholder="RAM (MB)" required>
            <input type="number" name="battery_power" placeholder="Battery Power (mAh)" required>
            <input type="number" name="int_memory" placeholder="Internal Memory (GB)" required>
            <input type="number" step="0.1" name="clock_speed" placeholder="Clock Speed (GHz)" required>
            <input type="number" name="n_cores" placeholder="No. of Cores" required>
            <input type="number" name="px_height" placeholder="Pixel Height" required>
            <input type="number" name="px_width" placeholder="Pixel Width" required>
            <button type="submit">Predict Price</button>
        </form>
        <h3>{{ prediction_text }}</h3>
    </div>
</body>
</html>
